<!DOCTYPE html>
<html>
<head>
  <title>Task Tracker Client</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .hidden { display: none; }
    .task { margin-left: 20px; }
  </style>
</head>
<body>
  <h1>molro don</h1>
  <div id="login">
    <input id="username" placeholder="Username">
    <select id="role">
      <option value="admin">Admin</option>
      <option value="user">User</option>
    </select>
    <button onclick="login()">Login</button>
  </div>

  <div id="main" class="hidden">
    <h2 id="welcome"></h2>

    <div id="admin-controls" class="hidden">
      <h3>Create Project</h3>
      <input id="projectName" placeholder="Project Name">
      <button onclick="createProject()">Create</button>

      <h3>Assign Tasks</h3>
      <select id="projectSelect"></select>
      <input id="assignee" placeholder="Assign to (username)">
      <input id="taskList" placeholder="Tasks (comma-separated)">
      <button onclick="assignTasks()">Assign</button>
    </div>

    <h3>My Tasks</h3>
    <div id="myTasks"></div>
  </div>

  <script>
    const socket = new WebSocket("ws://localhost:8080");
    let currentUser = null;

    socket.onopen = () => {
      console.log("Connected to server");
    };

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "login_success") {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("main").classList.remove("hidden");
        document.getElementById("welcome").textContent = `Welcome, ${currentUser.username}`;
        if (currentUser.role === "admin") {
          document.getElementById("admin-controls").classList.remove("hidden");
        }
        socket.send(JSON.stringify({ type: "get_all" }));
      } else if (msg.type === "all_data") {
        renderMyTasks(msg.projects);
        if (currentUser.role === "admin") {
          populateProjectSelect(msg.projects);
        }
      } else if (["project_created", "tasks_assigned", "progress_updated"].includes(msg.type)) {
        socket.send(JSON.stringify({ type: "get_all" }));
      }
    };

    function login() {
      const username = document.getElementById("username").value.trim();
      const role = document.getElementById("role").value;
      if (!username) return alert("Enter username");
      currentUser = { username, role };
      socket.send(JSON.stringify({ type: "login", username, role }));
    }

    function createProject() {
      const name = document.getElementById("projectName").value.trim();
      if (!name) return alert("Enter project name");
      socket.send(JSON.stringify({ type: "create_project", name }));
    }

    function assignTasks() {
      const code = document.getElementById("projectSelect").value;
      const user = document.getElementById("assignee").value.trim();
      const tasks = document.getElementById("taskList").value.split(",").map(t => t.trim()).filter(Boolean);
      if (!code || !user || !tasks.length) return alert("Fill out all fields");
      socket.send(JSON.stringify({ type: "assign", code, user, tasks }));
    }

    function toggleDone(code, tasks) {
      socket.send(JSON.stringify({
        type: "update_progress",
        code,
        user: currentUser.username,
        tasks
      }));
    }

    function renderMyTasks(projects) {
      const container = document.getElementById("myTasks");
      container.innerHTML = "";
      for (const [code, project] of Object.entries(projects)) {
        const assignment = project.assignments?.[currentUser.username];
        if (assignment) {
          const wrapper = document.createElement("div");
          wrapper.innerHTML = `<strong>${project.name}</strong> (${code})`;

          assignment.forEach((task, idx) => {
            const label = document.createElement("label");
            label.className = "task";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.done;
            checkbox.onchange = () => {
              assignment[idx].done = checkbox.checked;
              toggleDone(code, assignment);
            };
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(" " + task.text));
            wrapper.appendChild(label);
            wrapper.appendChild(document.createElement("br"));
          });

          container.appendChild(wrapper);
        }
      }
    }

    function populateProjectSelect(projects) {
      const select = document.getElementById("projectSelect");
      select.innerHTML = "";
      for (const [code, project] of Object.entries(projects)) {
        if (project.createdBy === currentUser.username) {
          const opt = document.createElement("option");
          opt.value = code;
          opt.textContent = `${project.name} (${code})`;
          select.appendChild(opt);
        }
      }
    }
  </script>
</body>
</html>
